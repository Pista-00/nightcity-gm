# 미리 만들어 두는 상황별 이미지 라이브러리
# - build_library.py 가 images/<id>.png 가 없는 항목만 생성 (Actions: "Build image library" 수동 실행)
# - 진행 중 해당 상황이 오면 장면 파일의 image: 에 id 를 적거나, post_image 워크플로로 Notion에 바로 전송
# - 공통 스타일 문구는 스크립트가 프롬프트 뒤에 자동으로 붙임
# - 폭력 장면은 생성 거절을 피하려고 "직전·긴장감" 위주로 묘사 (유혈 직접 묘사 금지)

# ───────── 도시 · 거리
- id: city-night-rain
  title: 비 내리는 나이트시티 야경 (오프닝)
  tags: [도시, 오프닝, 야간]
  prompt: Rainy cyberpunk megacity at night, towering dark corporate skyscraper with red light strips, armored VTOL police aircraft sweeping a searchlight over the street, neon signs in pink and cyan reflected on wet asphalt, lone figure in a long coat with a glowing red cybernetic eye and chrome arm, purple-magenta smog

- id: city-corporate-zone-day
  title: 기업 구역 낮 풍경
  tags: [도시, 기업, 주간]
  prompt: Clean gleaming corporate downtown plaza in daytime under grey smoggy sky, glass skyscrapers, armored corporate security guards in helmets patrolling, maglev train on elevated track, well-dressed executives with briefcases, holographic advertisements

- id: city-combat-zone
  title: 컴뱃존 거리
  tags: [도시, 컴뱃존, 위험]
